name: Prueba ficha BOE

on:
  workflow_dispatch:

permissions: {}

jobs:
  leer-ficha:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4

      - name: Leer valor y ubicacion
        shell: python -u {0}
        run: |
          import unicodedata
          import requests
          from bs4 import BeautifulSoup

          def normalizar(texto):
              texto = unicodedata.normalize("NFKD", texto)
              texto = "".join(
                  c for c in texto
                  if not unicodedata.combining(c)
              )
              return " ".join(texto.lower().split()).rstrip(":")

          base = "https://subastas.boe.es/detalleSubasta.php"
          referencia = "SUB-JA-2026-266805"

          session = requests.Session()
          session.headers["User-Agent"] = "AlertasSubastasGranada/0.1"
          session.max_redirects = 5

          consultas = [
              ("Informacion general", {"idSub": referencia}),
              ("Bienes", {"idSub": referencia, "ver": "3"}),
          ]

          campos = {
              "valor subasta",
              "lotes",
              "direccion",
              "codigo postal",
              "localidad",
              "provincia",
          }
          encontrados = set()

          for titulo, parametros in consultas:
              print(f"\nConsultando: {titulo}", flush=True)

              try:
                  respuesta = session.get(
                      base,
                      params=parametros,
                      timeout=(10, 20),
                  )
                  print(
                      f"Respuesta HTTP: {respuesta.status_code}",
                      flush=True,
                  )
                  respuesta.raise_for_status()

              except requests.exceptions.Timeout:
                  raise SystemExit(
                      f"ERROR en {titulo}: se ha superado el "
                      "limite de espera de conexion o de datos. "
                      "No se ha podido completar esta consulta."
                  )

              except requests.exceptions.RequestException as error:
                  raise SystemExit(
                      f"ERROR en {titulo}: {error}"
                  )

              pagina = BeautifulSoup(
                  respuesta.content, "html.parser"
              )
              print(f"--- {titulo}: {referencia} ---", flush=True)

              for fila in pagina.select("tr"):
                  celdas = fila
