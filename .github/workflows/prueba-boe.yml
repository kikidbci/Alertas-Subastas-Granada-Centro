name: Prueba BOE

on:
  workflow_dispatch:

permissions: {}

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4

      - name: Consultar viviendas en Granada
        shell: python
        run: |
          import re
          import requests
          from bs4 import BeautifulSoup

          url = "https://subastas.boe.es/subastas_ava.php"
          session = requests.Session()
          session.headers["User-Agent"] = "AlertasSubastasGranada/0.1"

          response = session.get(url, timeout=45)
          response.raise_for_status()
          soup = BeautifulSoup(response.content, "html.parser")
          form = soup.find("form", action="subastas_ava.php")
          if form is None:
              raise RuntimeError("No se encuentra el formulario esperado del BOE.")

          data = {}
          for element in form.select("input[name], select[name]"):
              name = element["name"]
              if element.name == "select":
                  option = element.find("option", selected=True)
                  if option is None:
                      option = element.find("option")
                  data[name] = option.get("value", "") if option else ""
              else:
                  kind = element.get("type", "text")
                  if kind in ("submit", "button"):
                      continue
                  if kind in ("radio", "checkbox") and not element.has_attr("checked"):
                      continue
                  data[name] = element.get("value", "")

          data.update({
              "dato[0]": "",
              "dato[3]": "I",
              "dato[4]": "501",
              "dato[7]": "Granada",
              "dato[8]": "18",
              "page_hits": "50",
              "accion": "Buscar",
          })

          for state, label in (("PU", "Proxima apertura"), ("EJ", "Celebrándose")):
              data["dato[2]"] = state
              result = session.post(url, data=data, timeout=45)
              result.raise_for_status()
              page = BeautifulSoup(result.content, "html.parser")
              text = page.get_text(" ", strip=True)
              ids = sorted(set(re.findall(
                  r"SUB-[A-Z]+-\d{4}-\d+", str(page)
              )))
              print(f"\n--- {label} ---")
              if ids:
                  print("Referencias encontradas en esta pagina:")
                  for auction_id in ids:
                      print(auction_id)
              elif "No se han encontrado documentos" in text:
                  print("Busqueda completada: sin resultados.")
              else:
                  print("Respuesta no reconocida. Extracto:")
                  print(text[:1500])
                  raise RuntimeError("No se puede confirmar la busqueda.")
